name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python / FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests + coverage (gate 80%)
        run: uv run pytest

      - name: Export OpenAPI schema (contrato real)
        run: uv run python scripts/export_openapi.py openapi.json

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.json
          retention-days: 1

  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    # Necesita el esquema OpenAPI real exportado por el backend: los tipos se
    # generan desde el contrato, nunca desde un esquema inventado (HU-17, T008/T010).
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download OpenAPI schema
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: backend

      - name: Generate types from the real OpenAPI
        run: npm run generate:types
        env:
          OPENAPI_PATH: ../backend/openapi.json

      - name: Fail if generated types are missing or out of date
        run: |
          git ls-files --error-unmatch src/api/types/evaluation.types.ts
          git diff --exit-code -- src/api/types/evaluation.types.ts

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Tests + coverage (gate 80%)
        run: npm run test:coverage

      - name: Build (type-check + bundle)
        run: npm run build

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
